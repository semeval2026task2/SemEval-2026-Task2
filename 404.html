<!doctype html>
<html><head><meta charset="utf-8"><title>Redirecting…</title>
<script>
  // Keep the repo segment ("/SemEval-2026-Task2")
  var pathSegmentsToKeep = 1;
  var l = window.location;
  var repo = l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/');
  l.replace(repo + '/?/' + l.pathname.slice(repo.length + 1) + l.search + l.hash);
</script>
</head><body></body></html>
