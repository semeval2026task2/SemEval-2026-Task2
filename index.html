    <script>
      /* Convert "?/route/segments&..." back to "/route/segments" */
      (function(l){
        if (l.search.startsWith('?/')) {
          const decoded = l.search
            .slice(2)                           // drop "?/"
            .split('&')
            .map(s => s.replace(/~and~/g, '&')) // undo encoding (see 404.html)
            .join('?');
          const newUrl = l.pathname.replace(/\/$/, '') + '/' + decoded + l.hash;
          window.history.replaceState(null, null, newUrl);
        }
      })(window.location);
      </script>
